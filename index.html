    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          linear-gradient(180deg, #1e2940 0%, #121a2a 32%, #0c1320 68%, #081018 100%);
      }

      body {
        margin: 0;
        min-height: 100vh;
        position: relative;
        background:
          linear-gradient(180deg, rgba(9, 17, 27, 0.2), rgba(9, 17, 27, 0.58) 38%, rgba(9, 17, 27, 0.82) 100%),
          linear-gradient(180deg, #233251 0%, #152138 34%, #09111b 100%);
        color: #f5f7fb;
        overflow-x: hidden;
      }

      #app {
        min-height: 100vh;
        position: relative;
        z-index: 0;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: -2;
      }

      body::before {
        background:
          linear-gradient(90deg, rgba(7, 11, 20, 0.74), rgba(7, 11, 20, 0.3) 36%, rgba(7, 11, 20, 0.66) 100%),
          linear-gradient(180deg, rgba(255, 184, 88, 0.12), rgba(255, 184, 88, 0) 32%, rgba(9, 17, 27, 0.45) 100%),
          url('/retro-room-bg.png') center center / cover no-repeat;
        opacity: 0.96;
      }

      body::after {
        inset: 0;
        background:
          radial-gradient(circle at 18% 18%, rgba(108, 148, 255, 0.2), transparent 24%),
          radial-gradient(circle at 82% 30%, rgba(255, 131, 185, 0.16), transparent 26%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0) 24%),
          repeating-linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.02) 0,
            rgba(255, 255, 255, 0.02) 1px,
            transparent 1px,
            transparent 4px
          );
        opacity: 0.42;
      }

      .app-shell {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 32px 20px 56px;
        position: relative;
      }

      .app-shell::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: -1;
        background:
          linear-gradient(180deg, rgba(9, 17, 27, 0.08), rgba(9, 17, 27, 0) 26%),
          linear-gradient(90deg, rgba(255, 198, 90, 0), rgba(255, 198, 90, 0.14), rgba(255, 198, 90, 0));
        opacity: 0.5;
      }

      .app-shell::after {
        content: "";
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 34vh;
        pointer-events: none;
        z-index: -1;
        background:
          linear-gradient(180deg, rgba(9, 17, 27, 0) 0%, rgba(9, 17, 27, 0.08) 24%, rgba(9, 17, 27, 0.4) 100%),
          repeating-linear-gradient(
            90deg,
            rgba(255, 119, 189, 0.12) 0,
            rgba(255, 119, 189, 0.12) 2px,
            transparent 2px,
            transparent 88px
          ),
          repeating-linear-gradient(
            0deg,
            rgba(101, 144, 255, 0.16) 0,
            rgba(101, 144, 255, 0.16) 2px,
            transparent 2px,
            transparent 52px
          );
        transform: perspective(900px) rotateX(80deg);
        transform-origin: bottom center;
        opacity: 0.34;
      }

      .app-shell__panel {
        width: min(100%, 1080px);
      }

      .app-shell__panel--loading {
        padding: 22px;
        border-radius: 30px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: linear-gradient(180deg, rgba(8, 13, 22, 0.74), rgba(8, 13, 22, 0.82));
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.24);
        backdrop-filter: blur(18px);
      }

      .app-shell__loading-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 0.92fr);
        gap: 18px;
        align-items: start;
      }

      .app-shell__loading-copy,
      .app-shell__loading-side {
        display: grid;
        gap: 14px;
        min-width: 0;
      }

      .app-shell__loading-copy .app-shell__lead {
        margin-top: 0;
        max-width: 620px;
      }

      .app-shell__loading-search {
        display: grid;
        gap: 10px;
        margin-top: 6px;
        padding: 18px;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(8, 12, 18, 0.34);
      }

      .app-shell__loading-label {
        margin: 0;
        color: #f5f7fb;
        font-size: 0.98rem;
        font-weight: 700;
      }

      .app-shell__loading-input {
        height: 50px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        background: rgba(3, 7, 14, 0.86);
      }

      .app-shell__loading-side {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .app-shell__loading-card {
        min-height: 110px;
        padding: 16px;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(8, 12, 18, 0.34);
      }

      .app-shell__loading-bar {
        display: block;
        height: 14px;
        border-radius: 999px;
        background: rgba(255, 214, 110, 0.16);
      }

      .app-shell__loading-bar--short {
        width: 34%;
      }

      .app-shell__loading-bar--value {
        width: 68%;
        height: 28px;
        margin-top: 14px;
      }

      .app-shell__loading-bar--note {
        width: 82%;
        margin-top: 14px;
        background: rgba(255, 255, 255, 0.08);
      }

      .app-shell__eyebrow {
        margin: 0 0 14px;
        color: #f1c95f;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .site-logo {
        display: inline-flex;
        align-items: center;
        text-decoration: none;
        color: inherit;
        margin-bottom: 20px;
      }

      .site-logo__image {
        display: block;
        width: clamp(132px, 34vw, 188px);
        height: auto;
        aspect-ratio: 1;
        border-radius: 50%;
        filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.28));
      }

      .app-shell h1 {
        margin: 0;
        max-width: 12ch;
        font-family: 'Russo One', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        font-size: clamp(1.8rem, 4.2vw, 3.75rem);
        line-height: 0.96;
        letter-spacing: 0;
        text-wrap: balance;
        text-shadow: 0 12px 30px rgba(0, 0, 0, 0.34);
      }

      .app-shell__lead {
        margin: 22px 0 0;
        max-width: 760px;
        color: #d2dae8;
        font-size: clamp(1.05rem, 2.4vw, 1.45rem);
        line-height: 1.5;
      }

      .app-shell__authority {
        margin: 14px 0 0;
        max-width: 720px;
        color: rgba(245, 247, 251, 0.92);
        font-size: 1rem;
        line-height: 1.55;
      }

      .app-shell__proof {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-top: 30px;
      }

      .app-shell__proof-item {
        padding: 14px 16px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.04);
      }

      .app-shell__proof-item strong {
        display: block;
        margin-bottom: 6px;
        font-size: 0.98rem;
      }

      .app-shell__proof-item span {
        color: #c1cadb;
        font-size: 0.94rem;
        line-height: 1.45;
      }

      .app-shell__compare {
        display: grid;
        gap: 12px;
        margin-top: 26px;
      }

      .app-shell__compare-intro,
      .app-shell__compare-note,
      .app-shell__compare-card {
        padding: 16px 18px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        background: rgba(8, 12, 18, 0.36);
        backdrop-filter: blur(14px);
      }

      .app-shell__compare-intro h2 {
        margin: 10px 0 8px;
        font-size: clamp(1.25rem, 2.6vw, 1.85rem);
        line-height: 1.08;
      }

      .app-shell__compare-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .app-shell__compare-card {
        display: grid;
        gap: 8px;
      }

      .app-shell__compare-card strong,
      .app-shell__compare-note strong {
        font-size: 1rem;
        line-height: 1.35;
      }

      .app-shell__compare-card span,
      .app-shell__compare-intro p,
      .app-shell__compare-card p,
      .app-shell__compare-note p {
        color: #c1cadb;
        line-height: 1.45;
      }

      .app-shell__compare-card small,
      .app-shell__compare-intro small {
        color: #f1c95f;
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .app-shell__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 28px;
      }

      .app-shell__action-note {
        margin: 14px 0 0;
        color: #f1c95f;
        font-size: 0.95rem;
      }

      .app-shell__trust {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }

      .app-shell__trust-badge {
        display: inline-flex;
        align-items: center;
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.045);
        color: #d2dae8;
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .app-shell__mini-preview {
        display: grid;
        gap: 12px;
        margin-top: 20px;
      }

      .app-shell__mini-preview-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .app-shell__mini-card {
        display: grid;
        gap: 8px;
        padding: 10px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.05);
      }

      .app-shell__mini-card-art {
        aspect-ratio: 3 / 4;
        border-radius: 12px;
        background:
          linear-gradient(160deg, rgba(255, 214, 110, 0.18), rgba(108, 148, 255, 0.16)),
          rgba(8, 12, 18, 0.92);
      }

      .app-shell__mini-card span {
        color: #f1c95f;
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .app-shell__mini-card strong {
        font-size: 0.86rem;
        line-height: 1.35;
      }

      .app-shell__systems {
        display: grid;
        gap: 12px;
        margin-top: 18px;
      }

      .app-shell__systems-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .app-shell__chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #f5f7fb;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.05);
      }

      .app-shell__button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 18px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        color: #f5f7fb;
        font-weight: 700;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(12px);
      }

      .app-shell__button--primary {
        border-color: rgba(241, 201, 95, 0.45);
        background: linear-gradient(135deg, rgba(241, 201, 95, 0.2), rgba(173, 110, 255, 0.18));
      }

      .app-shell__button:hover,
      .app-shell__button:focus-visible {
        border-color: rgba(255, 255, 255, 0.28);
      }

      .app-shell__link-groups {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        margin-top: 40px;
      }

      .app-shell__group {
        padding: 18px 18px 16px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        background: rgba(8, 12, 18, 0.32);
        backdrop-filter: blur(14px);
      }

      .app-shell__group h2 {
        margin: 0 0 12px;
        font-size: 1rem;
      }

      .app-shell__group ul {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .app-shell__group a {
        color: #dbe4f3;
        text-decoration: none;
      }

      .app-shell__group a:hover,
      .app-shell__group a:focus-visible {
        color: #ffffff;
        text-decoration: underline;
      }

      @media (max-width: 900px) {
        .app-shell__proof {
          grid-template-columns: 1fr;
        }

        .app-shell__compare-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .app-shell__link-groups {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 640px) {
        .app-shell {
          align-items: start;
          padding: 28px 16px 40px;
        }

        .app-shell__panel--loading {
          padding: 18px;
        }

        .app-shell__loading-grid {
          grid-template-columns: 1fr;
        }

        .app-shell__loading-side {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .app-shell__lead {
          font-size: 1.05rem;
        }

        .app-shell__compare-grid {
          grid-template-columns: 1fr;
        }

        .app-shell__actions {
          flex-direction: column;
          align-items: stretch;
        }

        .app-shell__button {
          width: 100%;
        }

        .app-shell__mini-preview-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
    <title>Retro Vault Elite - Retro Games Collection Tracker</title>

  <body>
    <div id="app">
      <main class="app-shell">
        <div class="app-shell__panel app-shell__panel--loading">
          <a href="/" class="site-logo" aria-label="Retro Vault Elite home">
            <img class="site-logo__image" src="/retro-vault-elite-logo.png" alt="Retro Vault Elite" width="320" height="320" decoding="async" fetchpriority="high" />
          </a>
          <div class="app-shell__loading-grid">
            <section class="app-shell__loading-copy" aria-label="Loading Retro Vault Elite">
              <p class="app-shell__eyebrow">Retro Vault Elite</p>
              <h1>Loading Retro Vault Elite...</h1>
              <p class="app-shell__lead">Getting the library, search, and collection tools ready.</p>
              <div class="app-shell__trust" aria-label="Trust badges">
                <span class="app-shell__trust-badge">No Download Needed</span>
                <span class="app-shell__trust-badge">Desktop &amp; Mobile</span>
                <span class="app-shell__trust-badge">Collector Built</span>
                <span class="app-shell__trust-badge">Private Trading</span>
              </div>
              <section class="app-shell__loading-search" aria-label="Library search loading">
                <p class="app-shell__loading-label">Search the games library</p>
                <div class="app-shell__loading-input" aria-hidden="true"></div>
              </section>
            </section>
            <section class="app-shell__loading-side" aria-hidden="true">
              <article class="app-shell__loading-card">
                <span class="app-shell__loading-bar app-shell__loading-bar--short"></span>
                <span class="app-shell__loading-bar app-shell__loading-bar--value"></span>
                <span class="app-shell__loading-bar app-shell__loading-bar--note"></span>
              </article>
              <article class="app-shell__loading-card">
                <span class="app-shell__loading-bar app-shell__loading-bar--short"></span>
                <span class="app-shell__loading-bar app-shell__loading-bar--value"></span>
                <span class="app-shell__loading-bar app-shell__loading-bar--note"></span>
              </article>
              <article class="app-shell__loading-card">
                <span class="app-shell__loading-bar app-shell__loading-bar--short"></span>
                <span class="app-shell__loading-bar app-shell__loading-bar--value"></span>
                <span class="app-shell__loading-bar app-shell__loading-bar--note"></span>
              </article>
              <article class="app-shell__loading-card">
                <span class="app-shell__loading-bar app-shell__loading-bar--short"></span>
                <span class="app-shell__loading-bar app-shell__loading-bar--value"></span>
                <span class="app-shell__loading-bar app-shell__loading-bar--note"></span>
              </article>
            </section>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
